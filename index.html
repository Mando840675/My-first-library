<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/ace08df5e1.js" crossorigin="anonymous"></script>
</head>
<body>
    <input type="checkbox" id="theme-toggle" class="theme-switch" aria-label="Toggle color theme">
    <input type="checkbox" id="nav-toggle" class="nav-switch" aria-label="Toggle navigation menu">

    <!-- Navigation Section -->
    <section id="landing">
        <nav>
            <div class="nav__container"> 
                <!-- Logo -->
                <img class="logo" src="./FES%20Library%20-%20CSS/assets/Library.svg" alt="Library logo">

                <div class="nav__actions">
                    <label for="theme-toggle" class="theme-toggle" aria-label="Toggle color theme">
                        <span class="theme-toggle__icon" aria-hidden="true"></span>
                    </label>

                    <label for="nav-toggle" class="menu-toggle" aria-label="Open navigation menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </label>
                </div>

                <!-- Navigation Links -->
                <ul class="nav__links">
                    <li><a href="#" class="nav__link">Home</a></li>
                    <li><a href="#" class="nav__link">Contact</a></li>
                    <li><a href="#" class="nav__link nav__link--primary">Books</a></li>
                </ul>
            </div>
        </nav>
        <header>
          <div class="header__container">
            <div class="header__description">
                <p class="eyebrow">Built for modern learning</p>
                <h1>United States most awarded online library platform</h1>
                <h2>Find your dream book with <span class="blue">Library</span></h2>
            </div>
            <figure class="hero-graphic">
                <img src="./FES%20Library%20-%20CSS/assets/Undraw_Books.svg" alt="Books illustration">
            </figure>
          </div>  
        </header>
    </section>

    <main>
    </main>
</body>
</html>
